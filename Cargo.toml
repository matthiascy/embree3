[package]
name = "embree3"
version = "0.4.0"
authors = [
    "Will Usher <will@willusher.io>",
    "Yang Chen <matthiasychen@gmail.com>",
]
homepage = "https://github.com/matthiascy/embree3"
documentation = "https://docs.rs/embree3/"
repository = "https://github.com/matthiascy/embree3"
readme = "README.md"
license = "MIT"
description = "Safe Rust bindings to Embree 3.13.5, Intel's high-performance ray-tracing kernels."
keywords = ["embree", "ray-tracing", "graphics", "bvh", "ffi"]
categories = ["rendering", "api-bindings", "external-ffi-bindings"]
build = "build.rs"
edition = "2021"

# Keep the published crate to the library itself: src/, build.rs, tests, benches,
# README/CHANGELOG/LICENSE. Everything below is local-dev, agent, or CI-only
# tooling that consumers neither need nor should receive.
exclude = [
    ".*",
    "*.png",
    "examples/*",
    "scripts",
    "rustfmt.toml",
    "tsan-suppressions.txt",
    "lsan-suppressions.txt",
]

[dependencies]
# Optional: when enabled, the default error reporter routes embree's asynchronous
# errors through the `log` facade instead of the stderr fallback. Off by default so
# the crate stays dependency-free unless the application opts in.
log = { version = "0.4", optional = true }

[dev-dependencies]
criterion = "0.8"
# See tests/compile_fail.rs.
trybuild = "1.0"

[[bench]]
name = "callback_throughput"
harness = false

[[bench]]
name = "bvh_traversal"
harness = false

[[bench]]
name = "lane_iter_throughput"
harness = false

[features]
log = ["dep:log"]

# docs.rs builds without an Embree install (see the DOCS_RS guard in build.rs);
# enable all features so every item is documented.
[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["examples/*"]
exclude = ["examples/todos"]
