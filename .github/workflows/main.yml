name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  EMBREE_VERSION: 3.13.5
jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt
      - name: Format Core
        run: cargo fmt -- --check
      - name: Format Examples
        run: scripts/check-examples-formatting.sh
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Test with Miri (pure-Rust tests only; FFI tests cannot run under Miri)
        run: cargo miri test --lib
  # Advisory, not a gate: embree's parallel build/commit runs on an uninstrumented
  # oneTBB pool, so TSAN reports false positives there, and the broad
  # `called_from_lib` suppressions that quiet them can also mask a real race that
  # surfaces only on an embree-rooted stack. TSAN still catches races wholly
  # within this crate's instrumented code. `continue-on-error` keeps it
  # non-blocking by design; promote to a gate only with narrower, CI-derived
  # suppressions.
  thread_sanitizer:
    name: thread_sanitizer (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rust-src
      - run: wget https://github.com/embree/embree/releases/download/v${EMBREE_VERSION}/embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: tar -xf embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: echo "EMBREE_DIR=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/" >> $GITHUB_ENV
      - run: echo "LD_LIBRARY_PATH=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/lib" >> $GITHUB_ENV
      - name: FFI concurrency tests under ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          # embree's parallel build/commit runs on an uninstrumented oneTBB pool;
          # suppress TSAN's false positives in those native libs (see the file).
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/tsan-suppressions.txt"
        run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --test callback_concurrency --test concurrent_bounds --test bvh_builder --test collide
          --test arc_scene_concurrent
  # Hard gate: ASan instruments this crate's code, so a use-after-free / OOB in
  # our FFI usage fails the build regardless of embree being uninstrumented. (LSan
  # leak reports rooted in embree/oneTBB are suppressed -- see lsan-suppressions.txt;
  # those patterns are necessarily broad, so a leak whose allocation routes through
  # an embree callback could be hidden until they are narrowed from real CI reports.)
  address_sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rust-src
      - run: wget https://github.com/embree/embree/releases/download/v${EMBREE_VERSION}/embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: tar -xf embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: echo "EMBREE_DIR=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/" >> $GITHUB_ENV
      - run: echo "LD_LIBRARY_PATH=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/lib" >> $GITHUB_ENV
      - name: FFI ownership/lifetime + lane gather/scatter tests under AddressSanitizer + LeakSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          # ASan includes LeakSanitizer; embree (and oneTBB, if linked) keep
          # at-exit allocations LSan would report. Suppress leaks rooted in those
          # uninstrumented native libs so only this crate's leaks surface (see the
          # file). `--lib` runs the in-crate unit tests (incl. the unchecked
          # gather/scatter column-offset guards); `--test lane_iter` drives the
          # optimized `for_each_active_lane` FFI gather/scatter path; the others
          # exercise the heap-owned callback closures + per-callback user data
          # (drop-once / replacement / borrow).
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/lsan-suppressions.txt"
        run: >
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu --lib
          --test callback_binding --test user_geometry_filter --test filter_closure_lifetime
          --test collide --test context_ext_recovery --test point_query_packet --test lane_iter
          --test filter_unchecked_accessors
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: wget https://github.com/embree/embree/releases/download/v${EMBREE_VERSION}/embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: tar -xf embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: source embree-${EMBREE_VERSION}.x86_64.linux/embree-vars.sh
      - run: echo "EMBREE_DIR=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/" >> $GITHUB_ENV
      - run: cargo build
      - run: cargo test
      - run: cargo doc
      - run: scripts/build-examples-linux-mac.sh
  # Compile-fail (trybuild) guards run only here, on a PINNED toolchain. trybuild
  # exact-matches normalized compiler output, which drifts across rustc versions,
  # so the snapshots in tests/compile_fail/*.stderr are tied to this exact
  # toolchain -- a pinned stable version, so the pin only moves on an intentional
  # bump (not every six weeks like a floating `stable`). The default `cargo test`
  # jobs skip these (the test is a no-op unless RUN_UI_TESTS is set). When bumping
  # `toolchain` below, regenerate the snapshots on the same version (see
  # tests/compile_fail.rs).
  compile_fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.96.0
          override: true
      - run: wget https://github.com/embree/embree/releases/download/v${EMBREE_VERSION}/embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: tar -xf embree-${EMBREE_VERSION}.x86_64.linux.tar.gz
      - run: echo "EMBREE_DIR=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/" >> $GITHUB_ENV
      - run: echo "LD_LIBRARY_PATH=`pwd`/embree-${EMBREE_VERSION}.x86_64.linux/lib" >> $GITHUB_ENV
      - name: Compile-fail soundness guards (trybuild)
        env:
          RUN_UI_TESTS: "1"
        run: cargo test --test compile_fail
  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: wget https://github.com/embree/embree/releases/download/v${EMBREE_VERSION}/embree-${EMBREE_VERSION}.x86_64.macosx.zip
      - run: unzip embree-${EMBREE_VERSION}.x86_64.macosx.zip
      - run: source embree-${EMBREE_VERSION}.x86_64.macosx/embree-vars.sh
      - run: echo "EMBREE_DIR=`pwd`/embree-${EMBREE_VERSION}.x86_64.macosx/" >> $GITHUB_ENV
      - run: cp -r $EMBREE_DIR/lib/* .
      - run: cargo build
      - run: scripts/build-test-mac.sh
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: choco install wget
      - run: wget https://github.com/embree/embree/releases/download/v${env:EMBREE_VERSION}/embree-${env:EMBREE_VERSION}.x64.vc14.windows.zip
      - run: 7z x embree-${env:EMBREE_VERSION}.x64.vc14.windows.zip -y
      - run: scripts/build-test-windows.ps1
